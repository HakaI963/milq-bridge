name: build
on:
  push: { branches: ["main"], tags: ["v*"] }
  pull_request: { branches: ["main"] }
  workflow_dispatch:
permissions: { contents: write }

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: unit tests (offline, mocked upstreams)
        run: python3 tests/test_bridge.py
      - name: smoke live endpoints + UI
        run: |
          BRIDGE_API_KEY=sk-ci python3 bridge/server.py --port 11439 >/tmp/s.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:11439/health
          curl -fsS -o /dev/null -w "ui %{http_code} %{size_download}B\n" http://127.0.0.1:11439/
          export K="Authorization: Bearer sk-ci"
          curl -fsS -H "$K" http://127.0.0.1:11439/v1/models | head -c 400; echo
          curl -fsS -H "$K" "http://127.0.0.1:11439/v1/models?tier=free" | head -c 200; echo
          curl -fsS -H "$K" http://127.0.0.1:11439/usage | head -c 300; echo
          curl -fsS -X POST -H "$K" -H "Content-Type: application/json" -d '{"model":"gpt-5.5"}' http://127.0.0.1:11439/ads/unlock; echo
          curl -s -X POST -H "$K" -H "Content-Type: application/json" -d '{"model":"gpt-5-codex","messages":[{"role":"user","content":"hi"}]}' http://127.0.0.1:11439/v1/chat/completions | head -c 300; echo
          pkill -f bridge/server.py || true

  apk:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      - name: generate gradle wrapper
        working-directory: apk
        run: gradle wrapper --gradle-version 8.13
      - name: assemble debug apk
        working-directory: apk
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: milq-bridge-debug, path: apk/app/build/outputs/apk/debug/*.apk }
      - name: release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: apk/app/build/outputs/apk/debug/*.apk, generate_release_notes: true }
